[package]
name = "gray-stats"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Merged stats plugin for the gray agent harness: observe, stamp, usage in one sidecar."

[[bin]]
name = "stats"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
